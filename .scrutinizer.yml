build:
  nodes:
    analysis:
      environment:
        php:
          version: 7.4

      dependencies:
        before:
          - |
            if [[ "$(php -r 'echo PHP_MAJOR_VERSION."."; echo PHP_MINOR_VERSION;')" =~ 8\.|7\.4 ]]; then
              composer global require "squizlabs/php_codesniffer:^3.6"
            fi
          - sudo apt-get update
          - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssl libssl-dev

      commands:
        - ~/.composer/vendor/bin/phpcs --report=checkstyle src/ > phpcs-result.xml || true
        - cat phpcs-result.xml

tools:
  php_code_sniffer: false
